<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0a13">
  <meta name="description" content="在余光深空观测站，探索太阳系的三颗独特行星。">
  <title>余光 · 深空观测站</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳转到内容</a>
  <header class="header frame">
    <a class="brand" href="#" aria-label="余光观测站首页"><span class="mark" aria-hidden="true">✦</span><span>余光 <small>AFTERLIGHT</small></span></a>
    <nav aria-label="主导航"><a href="#archive">观测档案</a><a href="#about">关于本站</a></nav>
  </header>
  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-inner frame">
        <div class="hero-copy">
          <p class="kicker"><span class="signal"></span> 太阳系观测站</p>
          <h1 id="hero-title">穿过黑暗，<br><em>去看星球。</em></h1>
          <p class="intro">从土星的冰环到海王星的风暴，<br>近距离探索三颗遥远的行星。</p>
          <a class="primary" href="#archive">开始观测 <span aria-hidden="true">↘</span></a>
        </div>
        <div class="hero-caption"><span aria-hidden="true">✧</span> 土星环想象图</div>
      </div>
    </section>
    <section class="archive frame" id="archive" aria-labelledby="archive-title">
      <div class="section-head">
        <div><p class="kicker">PLANETARY ARCHIVE</p><h2 id="archive-title">观测档案</h2></div>
        <p>选一颗行星，查看它的轨道与地貌。</p>
      </div>
      <div class="planet-picker" role="group" aria-label="选择行星">
        <button type="button" class="choice" data-planet="mars" aria-pressed="false"><span class="swatch mars" aria-hidden="true"></span><span>火星<small>MARS</small></span><span class="choice-arrow" aria-hidden="true">↗</span></button>
        <button type="button" class="choice" data-planet="saturn" aria-pressed="true"><span class="swatch saturn" aria-hidden="true"></span><span>土星<small>SATURN</small></span><span class="choice-arrow" aria-hidden="true">↗</span></button>
        <button type="button" class="choice" data-planet="neptune" aria-pressed="false"><span class="swatch neptune" aria-hidden="true"></span><span>海王星<small>NEPTUNE</small></span><span class="choice-arrow" aria-hidden="true">↗</span></button>
      </div>
      <article class="record" aria-live="polite">
        <div class="planet-stage" aria-hidden="true"><span class="orb saturn" id="planet-image"></span></div>
        <div class="record-body">
          <p class="kicker" id="planet-type">气态巨行星</p>
          <h3 id="planet-name">土星</h3>
          <p class="record-text" id="planet-description">从远处看，土星环像一张薄薄的唱片。近看则是数不清的冰块与岩石碎片，各自沿轨道绕着土星运行。</p>
          <dl class="stats">
            <div><dt>距太阳平均距离</dt><dd id="planet-distance">9.5 AU</dd></div>
            <div><dt>公转周期</dt><dd id="planet-orbit">29.4 地球年</dd></div>
          </dl>
          <a class="source" id="planet-source" href="https://science.nasa.gov/saturn/">查看 NASA 资料 ↗</a>
        </div>
      </article>
    </section>
  </main>
  <footer id="about" class="frame">
    <a class="brand" href="#"><span class="mark" aria-hidden="true">✦</span><span>余光 <small>AFTERLIGHT</small></span></a>
    <p>一座在线行星观测站。行星插图为艺术演绎。</p>
    <a href="#main">回到顶部 ↑</a>
  </footer>
</body>
</html>
